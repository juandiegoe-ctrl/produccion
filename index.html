<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal de Producción Estona</title>
<style>
:root{
  --bg:#f4f4f0;--panel:#fff;--ink:#20221f;--muted:#72756f;
  --line:#dedfd8;--danger:#8c3333;--soft:#f7f7f4;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}
.sidebar{height:100vh;position:sticky;top:0;background:#fff;border-right:1px solid #e5e5e5;padding:24px 16px}
.logo{padding:4px 12px 28px}
.logo img{width:132px;display:block}
.nav button{width:100%;border:0;background:#efefeb;text-align:left;padding:12px;border-radius:11px;font-weight:700}
.user{position:absolute;left:16px;right:16px;bottom:18px;background:#f6f6f3;border:1px solid #e5e5e5;border-radius:12px;padding:12px}
.user small{display:block;color:#666;margin-top:3px}
.logout{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;font-weight:700}
main{padding:27px;min-width:0}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}
.top h1{margin:0;font-size:30px}
.top p{margin:5px 0 0;color:var(--muted)}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750}
.primary{background:#000;color:#fff}
.secondary{background:#e7e7e2}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:17px}
.kpi{background:#fff;border:1px solid #e3e4de;border-radius:15px;padding:16px}
.kpi small{color:var(--muted);font-weight:700}
.kpi strong{display:block;font-size:23px;margin-top:7px}
.filters{display:flex;justify-content:flex-end;margin-bottom:14px}
.filters label{display:grid;gap:5px}
.filters span{font-size:11px;font-weight:750;color:var(--muted)}
.filters input{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-width:290px}
.list-wrap{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:12px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{position:sticky;top:0;background:#ecece7;color:#62645e;text-transform:uppercase;font-size:11px}
.row{cursor:pointer}
.row:hover td{background:#fafaf7}
.drawer{position:fixed;inset:0;background:rgba(15,17,15,.43);display:flex;justify-content:flex-end;z-index:30}
.drawer-card{width:min(780px,100%);height:100%;overflow:auto;background:#fff;padding:22px}
.drawer-head{display:flex;justify-content:space-between;gap:14px}
.drawer-head h2{margin:0}
.drawer-head p{margin:5px 0 0;color:var(--muted)}
.close{border:0;background:#eee;border-radius:10px;padding:8px 11px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin:18px 0}
.tab{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:11px;font-weight:700}
.tab.active{background:#000;color:#fff;border-color:#000}
.card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}
.card h3{margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800;color:#5e615b}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}
.items-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.items-heading h3{margin:0 0 4px}
.items-heading p{margin:0;color:var(--muted);font-size:12px}
.item-form{padding:14px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.items-list{display:grid;gap:12px}
.item-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fafaf7}
.item-head{display:flex;justify-content:space-between;gap:12px}
.item-code{font-weight:800;font-size:13px}
.item-actions{display:flex;gap:7px;flex-wrap:wrap}
.item-actions button{border:0;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:700}
.edit{background:#e7e7e2}
.duplicate{background:#dde8f5;color:#2e5d8a}
.delete{background:#f2dddd;color:var(--danger)}
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.item-field small{display:block;color:var(--muted);margin-bottom:4px}
.item-state{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}
.state-date{font-size:12px;color:var(--muted);margin-top:5px}
.timeline{display:grid;gap:10px}
.timeline-item{padding:12px 12px 12px 14px;border-left:3px solid #000;background:#f6f7f4;border-radius:0 10px 10px 0}
.timeline-item p{margin:5px 0}
.timeline-item small{color:var(--muted)}
.document{background:#fff;color:#000;padding:28px;border:1px solid #bbb}
.document-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:14px;margin-bottom:18px}
.document-head img{width:120px}
.document h2{margin:0}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc-item{border-bottom:1px solid #ddd;padding:8px 0}
.doc-item small{display:block;color:#666}
.qr-block{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.qr-block img{width:92px;height:92px;border:1px solid #ddd;padding:4px;background:#fff}
.qr-block small{font-size:10px;color:#555}
.production-table{width:100%;min-width:0;border-collapse:collapse;margin-top:10px}
.production-table th,.production-table td{position:static;border:1px solid #aaa;padding:6px 7px;font-size:10px;vertical-align:top}
.production-table th{background:#eee;color:#000}
.print-notes{margin-top:18px}
.print-notes h3{margin:0 0 8px;font-size:13px}
.notes-box{height:135px;border:1px solid #999;background:repeating-linear-gradient(to bottom,#fff 0,#fff 27px,#d6d6d6 28px)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.save-state{font-size:12px;color:var(--muted);margin-top:10px}
.login-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#fff;padding:24px}
.login-card{width:min(430px,100%);background:#fff}
.login-logo{display:flex;justify-content:center;margin-bottom:28px}
.login-logo img{width:150px}
.login-card h1{margin:0 0 34px;text-align:center;font-size:24px;font-weight:500;letter-spacing:3px}
.login-field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.login-field label{font-size:14px;font-weight:750}
.login-field input{width:100%;height:54px;border:1px solid #222;border-radius:10px;padding:0 15px}
.login-button{width:100%;height:56px;margin-top:8px;border:0;border-radius:10px;background:#000;color:#fff;font-weight:800}
.login-error{min-height:22px;margin-top:10px;color:#a40000;text-align:center;font-size:13px}
.login-version{margin-top:44px;padding-top:17px;border-top:1px solid #ddd;color:#666;text-align:center;font-size:13px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .app{grid-template-columns:1fr}.sidebar{display:none}main{padding:15px}
  .grid,.doc-grid,.item-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
  .items-heading,.item-head{flex-direction:column}.filters input{min-width:0;width:100%}
}

@media print{
  @page{size:letter portrait;margin:10mm}

  html,body{
    margin:0!important;
    padding:0!important;
    background:#fff!important;
  }

  #loginScreen,
  .app,
  .drawer-head,
  .tabs,
  #details,
  #items,
  #history,
  .no-print{
    display:none!important;
  }

  .drawer{
    position:static!important;
    inset:auto!important;
    display:block!important;
    background:none!important;
    width:auto!important;
    height:auto!important;
  }

  .drawer-card{
    width:100%!important;
    height:auto!important;
    overflow:visible!important;
    padding:0!important;
    margin:0!important;
  }

  #document{
    display:block!important;
    width:100%!important;
    margin:0!important;
    padding:0!important;
  }

  .document{
    position:static!important;
    width:100%!important;
    margin:0!important;
    padding:0!important;
    border:0!important;
    font-size:10px!important;
  }

  .document-head{
    display:flex!important;
    break-after:avoid;
  }

  .production-table{
    width:100%!important;
    table-layout:fixed;
  }

  .production-table thead{
    display:table-header-group;
  }

  .production-table tr{
    break-inside:avoid;
    page-break-inside:avoid;
  }

  .production-table th,
  .production-table td{
    font-size:9px!important;
    padding:4px 5px!important;
    word-break:break-word;
  }

  .production-table th:nth-child(1),
  .production-table td:nth-child(1){width:11%}
  .production-table th:nth-child(2),
  .production-table td:nth-child(2){width:27%}
  .production-table th:nth-child(3),
  .production-table td:nth-child(3){width:16%}
  .production-table th:nth-child(4),
  .production-table td:nth-child(4){width:19%}
  .production-table th:nth-child(5),
  .production-table td:nth-child(5){width:27%}

  .qr-block img{
    width:76px!important;
    height:76px!important;
  }

  .print-notes{
    break-inside:avoid;
    page-break-inside:avoid;
  }

  .notes-box{
    height:105px!important;
  }
}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_URL='https://ujyhzcomdzhppggteqnv.supabase.co';
const SUPABASE_KEY='sb_publishable_weeKs-Ri67UrVM__f7ZtiQ_kN1ldayw';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

const ITEM_STATES=['MOLDE','FUNDIR','PULIR','ALISTAR','ENTREGADO'];
let orders=[];
let requestedOrderOpened=false;

const $=selector=>document.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
}[char]));
const norm=value=>String(value||'').trim().toUpperCase();

function itemCodeBase(op){
  return String(op||'').replace(/\D/g,'').slice(-3).padStart(3,'0');
}
function nextItemCode(order){
  const used=(order.items||[]).map(item=>Number(String(item.codigo||'').split('-').pop())||0);
  return `${itemCodeBase(order.numero_op)}-${String(Math.max(0,...used)+1).padStart(3,'0')}`;
}
function mapOrder(row){
  return {
    ...row,
    items:(row.items_produccion||[]).sort((a,b)=>
      String(a.codigo||'').localeCompare(String(b.codigo||''),'es',{numeric:true})
    )
  };
}
function filtered(){
  const query=norm($('#search').value);
  return orders.filter(order=>
    !query || norm(`${order.numero_op} ${order.cliente} ${order.producto}`).includes(query)
  );
}
function renderKpis(){
  const totalItems=orders.reduce((sum,order)=>sum+order.items.length,0);
  const delivered=orders.reduce(
    (sum,order)=>sum+order.items.filter(item=>item.estado==='ENTREGADO').length,0
  );
  $('#kpis').innerHTML=[
    ['Órdenes',orders.length],
    ['Ítems totales',totalItems],
    ['Ítems en proceso',totalItems-delivered],
    ['Ítems entregados',delivered]
  ].map(([label,value])=>
    `<div class="kpi"><small>${label}</small><strong>${value}</strong></div>`
  ).join('');
}
function renderList(){
  const rows=filtered();
  $('#list').innerHTML=rows.length?`<div class="list-wrap"><table>
    <thead><tr>
      <th>OP</th><th>Cliente</th><th>Producto</th>
      <th>Fecha inicio</th><th>Fecha entrega</th><th>Ítems</th>
    </tr></thead>
    <tbody>${rows.map(order=>`<tr class="row" data-id="${esc(order.id)}">
      <td><strong>${esc(order.numero_op||'SIN OP')}</strong></td>
      <td>${esc(order.cliente||'—')}</td>
      <td>${esc(order.producto||'—')}</td>
      <td>${esc(order.fecha_inicio||'—')}</td>
      <td>${esc(order.fecha_entrega||'—')}</td>
      <td>${order.items.length}</td>
    </tr>`).join('')}</tbody>
  </table></div>`:`<div class="empty">No hay órdenes de producción.</div>`;

  document.querySelectorAll('.row').forEach(row=>{
    row.onclick=()=>openOrder(row.dataset.id);
  });
}
function renderAll(){
  renderKpis();
  renderList();
}
function closeDrawer(){
  $('#drawer').classList.add('hidden');
  $('#drawer').innerHTML='';
}
function displayError(error){
  console.error(error);
  $('#list').innerHTML=`<div class="empty">Error: ${esc(error?.message||error)}</div>`;
}

async function loadOrders({openRequested=true}={}){
  $('#list').innerHTML='<div class="empty">Cargando órdenes...</div>';
  const {data,error}=await db
    .from('ordenes_produccion')
    .select('*, items_produccion(*)')
    .order('numero_op',{ascending:true});

  if(error) throw error;
  orders=(data||[]).map(mapOrder);
  renderAll();

  if(openRequested && !requestedOrderOpened){
    const token=new URLSearchParams(location.search).get('orden');
    const target=orders.find(order=>String(order.qr_token)===String(token));
    if(target){
      requestedOrderOpened=true;
      setTimeout(()=>openOrder(target.id),100);
    }
  }
}

async function openNew(){
  const drawer=$('#drawer');
  drawer.innerHTML=`<div class="drawer-card">
    <div class="drawer-head">
      <div><h2>Nueva orden</h2><p>Información general de la OP.</p></div>
      <button class="close">✕</button>
    </div>
    <form id="newForm" style="margin-top:18px">
      <div class="card"><div class="grid">
        <div class="field"><label>OP</label><input name="op" required></div>
        <div class="field"><label>Cliente</label><input name="cliente" required></div>
        <div class="field full"><label>Producto</label><input name="producto" required></div>
        <div class="field"><label>Fecha inicio</label><input name="fechaInicio" type="date"></div>
        <div class="field"><label>Fecha entrega</label><input name="fechaEntrega" type="date"></div>
      </div></div>
      <div style="display:flex;justify-content:flex-end;gap:9px;margin-top:14px">
        <button type="button" class="btn secondary cancel">Cancelar</button>
        <button class="btn primary">Crear orden</button>
      </div>
    </form>
  </div>`;

  drawer.classList.remove('hidden');
  drawer.querySelector('.close').onclick=closeDrawer;
  drawer.querySelector('.cancel').onclick=closeDrawer;
  drawer.querySelector('#newForm').onsubmit=async event=>{
    event.preventDefault();
    const values=Object.fromEntries(new FormData(event.currentTarget).entries());
    const {error}=await db.from('ordenes_produccion').insert({
      numero_op:values.op.trim(),
      cliente:values.cliente.trim(),
      producto:values.producto.trim(),
      fecha_inicio:values.fechaInicio||null,
      fecha_entrega:values.fechaEntrega||null
    });
    if(error){
      alert(error.message);
      return;
    }
    closeDrawer();
    await loadOrders({openRequested:false});
  };
}

          <div class="qr-block">
            <strong>${esc(order.numero_op||'SIN OP')}</strong>
            <img id="orderQr" alt="QR de la orden">
            <small>Escanear para abrir la orden</small>
          </div>
        </div>

        <div class="doc-grid">
          <div class="doc-item"><small>Cliente</small><strong>${esc(order.cliente||'—')}</strong></div>
          <div class="doc-item"><small>Producto</small><strong>${esc(order.producto||'—')}</strong></div>
          <div class="doc-item"><small>Fecha inicio</small><strong>${esc(order.fecha_inicio||'—')}</strong></div>
          <div class="doc-item"><small>Fecha entrega</small><strong>${esc(order.fecha_entrega||'—')}</strong></div>
        </div>

        <div id="documentItems"></div>
        <section class="print-notes">
          <h3>OBSERVACIONES DE PRODUCCIÓN</h3>
          <div class="notes-box"></div>
        </section>
        <div class="no-print" style="margin-top:16px">
          <button class="btn primary" onclick="window.print()">Imprimir / Guardar PDF</button>
        </div>
      </div>
    </section>

    <section id="history" class="panel hidden">
      <div class="card">
        <h3>Historial de estados</h3>
        <div id="timeline" class="timeline"></div>
      </div>
    </section>
  </div>`;

  drawer.classList.remove('hidden');
  drawer.querySelector('.close').onclick=closeDrawer;

  drawer.querySelectorAll('.tab').forEach(button=>{
    button.onclick=()=>{
      drawer.querySelectorAll('.tab').forEach(tab=>
        tab.classList.toggle('active',tab===button)
      );
      drawer.querySelectorAll('.panel').forEach(panel=>
        panel.classList.toggle('hidden',panel.id!==button.dataset.tab)
      );
    };
  });

  const renderDocument=()=>{
    const rows=order.items.length?order.items.map(item=>`<tr>
      <td>${esc(item.codigo)}</td>
      <td>${esc(item.descripcion||'—')}</td>
      <td>${esc(item.dimensiones||'—')}</td>
      <td>${esc(item.colores||'—')}</td>
      <td>${esc(item.comentarios||'—')}</td>
    </tr>`).join(''):`<tr><td colspan="5">Sin ítems registrados.</td></tr>`;

    drawer.querySelector('#documentItems').innerHTML=`
      <h3 style="margin:18px 0 8px">ÍTEMS DE PRODUCCIÓN</h3>
      <table class="production-table">
        <thead><tr>
          <th>Código</th><th>Descripción</th><th>Dimensiones</th>
          <th>Colores</th><th>Comentarios</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;

    const targetUrl=`${location.origin}${location.pathname}?orden=${encodeURIComponent(order.qr_token)}`;
    drawer.querySelector('#orderQr').src=
      `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data=${encodeURIComponent(targetUrl)}`;
  };

  const renderHistory=async()=>{
    if(!order.items.length){
      drawer.querySelector('#timeline').innerHTML='<div class="empty">Sin historial.</div>';
      return;
    }

    const itemIds=order.items.map(item=>item.id);
    const {data,error}=await db
      .from('historial_items')
      .select('*, items_produccion(codigo)')
      .in('item_id',itemIds)
      .order('created_at',{ascending:false});

    if(error){
      drawer.querySelector('#timeline').innerHTML=
        `<div class="empty">${esc(error.message)}</div>`;
      return;
    }

    drawer.querySelector('#timeline').innerHTML=(data||[]).length?
      data.map(entry=>`<div class="timeline-item">
        <strong>${esc(entry.items_produccion?.codigo||'Ítem')}</strong>
        <p>${esc(entry.estado_anterior||'—')} → ${esc(entry.estado_nuevo||'—')}</p>
        <small>${new Date(entry.created_at).toLocaleString('es-CO')}</small>
      </div>`).join(''):
      '<div class="empty">Sin historial.</div>';
  };

  const refreshCurrentOrder=async()=>{
    await loadOrders({openRequested:false});
    const refreshed=orders.find(candidate=>candidate.id===order.id);
    if(refreshed) await openOrder(refreshed.id);
  };

  const renderItems=()=>{
    const list=drawer.querySelector('#itemsList');

    list.innerHTML=order.items.length?order.items.map(item=>`<article class="item-card">
      <div class="item-head">
        <div>
          <div class="item-code">${esc(item.codigo)}</div>
          <strong>${esc(item.descripcion)}</strong>
        </div>
        <div class="item-actions">
          <button class="edit" data-edit="${esc(item.id)}">Editar</button>
          <button class="duplicate" data-duplicate="${esc(item.id)}">Duplicar</button>
          <button class="delete" data-delete="${esc(item.id)}">Eliminar</button>
        </div>
      </div>

      <div class="item-grid">
        <div class="item-field"><small>Dimensiones</small>
          <strong>${esc(item.dimensiones||'—')}</strong>
        </div>
        <div class="item-field"><small>Colores</small>
          <strong>${esc(item.colores||'—')}</strong>
        </div>
        <div class="item-field"><small>Estado</small>
          <select class="item-state" data-state="${esc(item.id)}">
            ${ITEM_STATES.map(state=>
              `<option ${state===item.estado?'selected':''}>${state}</option>`
            ).join('')}
          </select>
          <div class="state-date">
            ${item.fecha_ultimo_estado?
              `Último cambio: ${new Date(item.fecha_ultimo_estado).toLocaleString('es-CO')}`:
              'Sin fecha registrada'}
          </div>
        </div>
        <div class="item-field"><small>Persona que pulió</small>
          <strong>${esc(item.pulidor||'—')}</strong>
        </div>
        <div class="item-field" style="grid-column:1/-1"><small>Comentarios</small>
          <span>${esc(item.comentarios||'—')}</span>
        </div>
      </div>
    </article>`).join(''):`<div class="empty">Todavía no hay ítems.</div>`;

    list.querySelectorAll('[data-state]').forEach(select=>{
      select.onchange=async()=>{
        select.disabled=true;
        const {error}=await db
          .from('items_produccion')
          .update({estado:select.value})
          .eq('id',select.dataset.state);

        if(error){
          alert(error.message);
          select.disabled=false;
          return;
        }
        await refreshCurrentOrder();
      };
    });

    list.querySelectorAll('[data-edit]').forEach(button=>{
      button.onclick=()=>{
        const item=order.items.find(candidate=>candidate.id===button.dataset.edit);
        drawer.querySelector('[name="itemDescription"]').value=item.descripcion||'';
        drawer.querySelector('[name="itemDimensions"]').value=item.dimensiones||'';
        drawer.querySelector('[name="itemColors"]').value=item.colores||'';
        drawer.querySelector('[name="itemState"]').value=item.estado||'MOLDE';
        drawer.querySelector('[name="itemPulidor"]').value=item.pulidor||'';
        drawer.querySelector('[name="itemComments"]').value=item.comentarios||'';
        drawer.querySelector('#itemForm').dataset.editing=item.id;
        drawer.querySelector('#itemForm').classList.remove('hidden');
      };
    });

    list.querySelectorAll('[data-duplicate]').forEach(button=>{
      button.onclick=async()=>{
        const item=order.items.find(
          candidate=>candidate.id===button.dataset.duplicate
        );
        const {error}=await db.from('items_produccion').insert({
          orden_id:order.id,
          codigo:nextItemCode(order),
          descripcion:item.descripcion,
          dimensiones:item.dimensiones,
          colores:item.colores,
          comentarios:item.comentarios,
          estado:item.estado,
          pulidor:item.pulidor
        });
        if(error){
          alert(error.message);
          return;
        }
        await refreshCurrentOrder();
      };
    });

    list.querySelectorAll('[data-delete]').forEach(button=>{
      button.onclick=async()=>{
        if(!confirm('¿Eliminar este ítem?')) return;
        const {error}=await db
          .from('items_produccion')
          .delete()
          .eq('id',button.dataset.delete);
        if(error){
          alert(error.message);
          return;
        }
        await refreshCurrentOrder();
      };
    });
  };

  let saveTimer;
  drawer.querySelectorAll('[data-field]').forEach(input=>{
    input.addEventListener('input',()=>{
      clearTimeout(saveTimer);
      drawer.querySelector('#saveState').textContent='Guardando...';

      saveTimer=setTimeout(async()=>{
        const value=name=>drawer.querySelector(`[data-field="${name}"]`)?.value||null;
        const {error}=await db.from('ordenes_produccion').update({
          numero_op:value('numero_op'),
          cliente:value('cliente'),
          producto:value('producto'),
          fecha_inicio:value('fecha_inicio'),
          fecha_entrega:value('fecha_entrega')
        }).eq('id',order.id);

        drawer.querySelector('#saveState').textContent=error?
          `Error: ${error.message}`:
          '✓ Guardado en Supabase';

        if(!error) await loadOrders({openRequested:false});
      },700);
    });
  });

  drawer.querySelector('#showItemForm').onclick=()=>{
    drawer.querySelector('#itemForm').dataset.editing='';
    drawer.querySelectorAll('#itemForm input,#itemForm textarea')
      .forEach(field=>field.value='');
    drawer.querySelector('[name="itemState"]').value='MOLDE';
    drawer.querySelector('#itemForm').classList.remove('hidden');
  };

  drawer.querySelector('#cancelItem').onclick=()=>{
    drawer.querySelector('#itemForm').classList.add('hidden');
  };

  drawer.querySelector('#saveItem').onclick=async()=>{
    const description=drawer.querySelector('[name="itemDescription"]').value.trim();
    if(!description){
      alert('Escribe una descripción.');
      return;
    }

    const payload={
      orden_id:order.id,
      descripcion:description,
      dimensiones:drawer.querySelector('[name="itemDimensions"]').value.trim()||null,
      colores:drawer.querySelector('[name="itemColors"]').value.trim()||null,
      estado:drawer.querySelector('[name="itemState"]').value,
      pulidor:drawer.querySelector('[name="itemPulidor"]').value.trim()||null,
      comentarios:drawer.querySelector('[name="itemComments"]').value.trim()||null
    };

    const editingId=drawer.querySelector('#itemForm').dataset.editing;
    let result;

    if(editingId){
      result=await db.from('items_produccion').update(payload).eq('id',editingId);
    }else{
      payload.codigo=nextItemCode(order);
      result=await db.from('items_produccion').insert(payload);
    }

    if(result.error){
      alert(result.error.message);
      return;
    }
    await refreshCurrentOrder();
  };

  renderItems();
  renderDocument();
  renderHistory();
}

async function handleLogin(event){
  event.preventDefault();
  const email=$('#loginUser').value.trim();
  const password=$('#loginPassword').value;
  $('#loginError').textContent='Ingresando...';

  const {error}=await db.auth.signInWithPassword({email,password});
  if(error){
    $('#loginError').textContent='Correo o contraseña incorrectos.';
    return;
  }
  $('#loginError').textContent='';
}

async function handleLogout(){
  await db.auth.signOut();
}

function showAuthenticated(user){
  $('#loginScreen').classList.add('hidden');
  document.body.style.overflow='';
  const userLabel=document.querySelector('.user strong');
  if(userLabel) userLabel.textContent=user.email||'Usuario';
  loadOrders().catch(displayError);
}

function showLogin(){
  $('#loginScreen').classList.remove('hidden');
  document.body.style.overflow='hidden';
  orders=[];
  renderAll();
}

async function init(){
  $('#loginForm').onsubmit=handleLogin;
  $('#logoutButton').onclick=handleLogout;
  $('#search').oninput=renderAll;
  $('#newOrder').onclick=openNew;

  const {data:{session}}=await db.auth.getSession();
  if(session?.user) showAuthenticated(session.user);
  else showLogin();

  db.auth.onAuthStateChange((_event,session)=>{
    if(session?.user) showAuthenticated(session.user);
    else showLogin();
  });

  db.channel('produccion-estona')
    .on('postgres_changes',{
      event:'*',schema:'public',table:'ordenes_produccion'
    },()=>loadOrders({openRequested:false}).catch(displayError))
    .on('postgres_changes',{
      event:'*',schema:'public',table:'items_produccion'
    },()=>loadOrders({openRequested:false}).catch(displayError))
    .subscribe();
}

init();

</script>
