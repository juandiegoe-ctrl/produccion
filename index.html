<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producción Estona</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-card">
    <div class="login-logo">
      <img src="assets/logo-estona.png" alt="Estona">
    </div>
    <h1>PORTAL DE PRODUCCIÓN ESTONA</h1>

    <div class="login-field">
      <label for="loginUser">Usuario</label>
      <input id="loginUser" autocomplete="username" required>
    </div>

    <div class="login-field">
      <label for="loginPassword">Contraseña</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
    </div>

    <button class="login-button" type="submit">INGRESAR</button>
    <div id="loginError" class="login-error"></div>
    <div class="login-version">v0.3 Beta</div>
  </form>
</div>

<div class="app">
<aside class="sidebar">
<div class="logo"><img src="assets/logo-estona.png" alt="Estona"></div>
<div class="nav"><button class="active">Órdenes de producción</button></div>
<div class="user"><strong id="currentUser">JUANDIEGO</strong><small>Portal independiente</small><button id="logoutButton" class="logout-button" type="button">Cerrar sesión</button></div>
</aside>
<main>
<header class="top"><div><h1>Portal Producción Estona</h1><p>Gestión interna de órdenes e ítems de producción.</p></div><button id="newOrder" class="btn primary">+ Nueva orden</button></header>
<section id="kpis" class="kpis"></section>
<section class="filters"><label><span>Buscar</span><input id="search" placeholder="OP, cliente o producto"></label></section>
<section id="list"></section>
</main>
</div>
<div id="drawer" class="drawer hidden"></div>
<script src="js/app.js"></script>
</body>
</html>
